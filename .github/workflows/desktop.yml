name: desktop
on:
  push:
    # with only tags listed, branch pushes would never run; path filters do not apply to tags
    branches: ['**']
    paths: ['desktop/**', '.signpath/**', '.github/workflows/desktop.yml', '.github/workflows/desktop-release.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', '.signpath/**', '.github/workflows/desktop.yml', '.github/workflows/desktop-release.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: windows-2025, platform: win32, arch: x64 }
          - { os: windows-11-arm, platform: win32, arch: arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    env:
      # only this job's architecture has its Python prepared (build/arch.cjs)
      PIPER_DESKTOP_ARCH: ${{ matrix.arch }}
      SIGNPATH_ENABLED: ${{ matrix.platform == 'win32' && startsWith(github.ref, 'refs/tags/desktop-v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run prepare:resources
      - name: Shared styles must match the core
        shell: bash
        run: git diff --exit-code -- src/ui/shared.css src/ui/themes.json src/runtime.json
      - run: node build/python.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Linux test sandbox and display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libnotify4 libxss1 libxtst6 libfuse2
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit tests through OS sandbox
        if: runner.os != 'Windows'
        run: npm test
      - name: Browser verification tool
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/piper-browser-tools" --no-save agent-browser@0.39.2
          echo "$RUNNER_TEMP/piper-browser-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Electron E2E through OS sandbox (Linux)
        if: runner.os == 'Linux'
        env:
          PIPER_E2E_AGENT_BROWSER: '1'
          PIPER_SANDBOX_READ: ${{ runner.temp }}/piper-browser-tools
        run: xvfb-run -a npm run e2e
      - name: Electron E2E through OS sandbox (macOS)
        if: runner.os == 'macOS'
        env:
          PIPER_E2E_AGENT_BROWSER: '1'
          PIPER_SANDBOX_READ: ${{ runner.temp }}/piper-browser-tools
        run: npm run e2e
      - name: Windows unit tests through WSL OS sandbox
        # the Windows arm64 runner has no WSL (no nested virtualization)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          wsl --install --distribution Ubuntu --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'WSL 2 is required for sandboxed tests on this runner' }
          wsl -d Ubuntu -u root -- sh -c 'apt-get update -qq && apt-get install -y -qq nodejs python3 bubblewrap'
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare WSL test tools' }
          # --exec: no Linux shell in between that would eat the backslashes of a Windows path
          $linuxPath = (wsl -d Ubuntu --exec wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          if (-not $linuxPath) { throw 'wslpath returned nothing' }
          wsl -d Ubuntu --exec node "$linuxPath/desktop/test/run.mjs" unit
          if ($LASTEXITCODE -ne 0) { throw 'Sandboxed unit tests failed' }
      - name: Windows app's wsl.exe calls against the real WSL
        # the Windows arm64 runner has no WSL (no nested virtualization)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: node test/wsl-smoke.cjs Ubuntu
      - name: Validate unpacked application
        if: env.SIGNPATH_ENABLED != 'true'
        # bash: PowerShell drops the `--` that hands the flags to electron-builder
        shell: bash
        run: npm run pack -- --${{ matrix.arch }} --publish never
      - name: Build installers (never publish from electron-builder)
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.SIGNPATH_ENABLED != 'true'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          npm run dist -- --${{ matrix.arch }} --publish never --config.extraMetadata.version="$version"
      - name: Package Windows app for SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        env:
          PIPER_SIGNPATH: '1'
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          npm run pack -- --${{ matrix.arch }} --publish never --config.extraMetadata.version="$version"
      - uses: actions/upload-artifact@v4.6.2
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned-app
        with:
          name: signpath-app-${{ matrix.arch }}
          path: desktop/out/${{ matrix.arch == 'x64' && 'win-unpacked' || 'win-arm64-unpacked' }}/
          if-no-files-found: error
      - name: Sign Windows app and download signed directory
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: desktop/out/signed-app
      - name: Build NSIS from the signed Windows app
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        env:
          PIPER_SIGNPATH: '1'
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          npm run dist -- --${{ matrix.arch }} --prepackaged out/signed-app --publish never --config.extraMetadata.version="$version"
      - uses: actions/upload-artifact@v4.6.2
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned-installer
        with:
          name: signpath-installer-${{ matrix.arch }}
          path: desktop/out/*.exe
          if-no-files-found: error
      - name: Sign Windows installer and download it
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: desktop/out/signed-installer
      - name: Refresh updater hashes and blockmap after signing
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          node build/signed-updates.mjs "out/signed-installer/Piper-$version-win-${{ matrix.arch }}.exe" out
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in out/mac*/Piper.app; do
            codesign --verify --deep --strict "$app"
          done
      - uses: actions/upload-artifact@v4.6.2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
            desktop/out/desktop*.yml
            desktop/out/*.blockmap
      - uses: actions/upload-artifact@v4.6.2
        if: always() && runner.os != 'Windows'
        with:
          name: shots-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/test/shots/
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: desktop-*
          path: artifacts
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft > release.json 2>/dev/null || gh release create "$GITHUB_REF_NAME" --draft --title "Piper desktop ${GITHUB_REF_NAME#desktop-v}" --notes 'Desktop window update. Piper services and sessions are managed separately.'
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -qx true
          # Each architecture has its own updater channel; no metadata or installer collisions.
          python3 - <<'PY'
          import pathlib, subprocess
          for folder in sorted(pathlib.Path('artifacts').iterdir()):
              for file in sorted(folder.iterdir()):
                  if file.suffix == '.yml':
                      # Windows/macOS metadata filenames are shared between architectures.
                      # Namespacing is resolved by the updater's arch-specific channel.
                      platform, arch = folder.name.removeprefix('desktop-').rsplit('-', 1)
                      suffix = {'darwin': '-mac', 'win32': '', 'linux': '-linux' + ('' if arch == 'x64' else '-' + arch)}[platform]
                      file = file.rename(file.with_name('desktop-' + arch + suffix + '.yml'))
                  subprocess.run(['gh', 'release', 'upload', __import__('os').environ['GITHUB_REF_NAME'], str(file)], check=True)
          PY
