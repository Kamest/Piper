# The project page (site/index.html) with the README media, at https://kamest.github.io/Piper/.
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/media/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Assemble _site
        run: |
          mkdir -p _site/media
          cp site/index.html _site/
          cp docs/media/*.png docs/media/*.gif docs/media/*.mp4 docs/media/*.jpg _site/media/
          cp piper/web/icon.svg _site/media/icon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
