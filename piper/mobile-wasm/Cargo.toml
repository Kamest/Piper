[package]
name = "piper-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-util = { version = "0.3", features = ["io"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
